name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Criteria doc is up to date
        if: matrix.os == 'ubuntu-latest'
        run: python tools/gen_criteria_doc.py --check
